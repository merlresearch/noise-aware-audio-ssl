[project]
name = "nassl"
version = "0.1.0"
description = "Noise-Aware Audio Self-Supervised Learning"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch>=2.4,<3",
    "torchaudio>=2.4,<3",
    "soundfile",
    "numpy>=1.17",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.2,<2.4",
    "transformers>=4.35,<5",
    "timm<2",
    "torchvision",
    "einops",
    "filelock",
    "tqdm",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
train = [
    "lightning>=2.1,<3",
    "pandas>=2,<3",
    "tensorboard",
    "librosa>=0.10,<1",
    "pyroomacoustics>=0.7,<1",
    "typing-extensions>=4.4",
]

[project.scripts]
nassl = "nassl:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "checkpoint: tests that require external pretrained checkpoints or model assets",
]
