_target_: nassl.plmodel.NoiseAwarePLModel
model_cfg:
  _target_: nassl.model.NABEATs
  model_id: "BEATs_iter3"
  trainable_base: false
  eval_base: true
  fusion_layer_cfg:
    _target_: nassl.module.fusion.PreNormCrossAttnBlock
    attention_cfg:
      num_heads: 8
      dropout: 0.1
    hidden_dim_multiplier: 3
    init_identity: true
loss_cfg:
  _target_: nassl.loss.MSELoss
optim_cfg:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
lrscheduler_cfg: null
teacher_model_cfg:
  _target_: nassl.feature_extraction_model.FE_BEATs
  model_id: ${plmodel.model_cfg.model_id}
